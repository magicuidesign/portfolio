<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <filter id="msGlow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="50" fill="url(#msBg)" />
  <circle cx="50" cy="50" r="42" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Microsoft 4 Squares Grid -->
  <rect x="28" y="28" width="20" height="20" rx="2" fill="#f25022" />
  <rect x="52" y="28" width="20" height="20" rx="2" fill="#7fba00" />
  <rect x="28" y="52" width="20" height="20" rx="2" fill="#00a4ef" />
  <rect x="52" y="52" width="20" height="20" rx="2" fill="#ffb900" />
  <!-- C# Purple Overlay Badge -->
  <circle cx="70" cy="70" r="15" fill="#68217a" stroke="#ffffff" stroke-width="2" filter="url(#msGlow)" />
  <text x="70" y="75" font-family="monospace, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">C#</text>
</svg>

