<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="karbBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#065f46" />
      <stop offset="0.5" stop-color="#047857" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="karbGold" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a" />
      <stop offset="0.5" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <filter id="karbGlow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#34d399" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="50" fill="url(#karbBg)" />
  <circle cx="50" cy="50" r="42" stroke="url(#karbGold)" stroke-width="1.8" />
  <!-- Academic Science Atom Core -->
  <circle cx="50" cy="50" r="8" fill="#fef08a" filter="url(#karbGlow)" />
  <!-- Atomic Elliptical Orbitals -->
  <ellipse cx="50" cy="50" rx="26" ry="10" stroke="#a7f3d0" stroke-width="2" transform="rotate(30 50 50)" />
  <ellipse cx="50" cy="50" rx="26" ry="10" stroke="#a7f3d0" stroke-width="2" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="26" ry="10" stroke="#6ee7b7" stroke-width="2" transform="rotate(90 50 50)" />
  <!-- Electrons -->
  <circle cx="28" cy="38" r="3" fill="#ffffff" />
  <circle cx="72" cy="62" r="3" fill="#ffffff" />
  <circle cx="50" cy="24" r="3" fill="#ffffff" />
</svg>

